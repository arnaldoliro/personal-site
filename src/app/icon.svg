<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="al" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>
  <!-- fundo escuro do site, para as letras se destacarem em abas claras -->
  <rect width="64" height="64" rx="14" fill="#171717"/>
  <g fill="url(#al)">
    <!-- A: pernas diagonais + travessao, maior que o L -->
    <polygon points="16,6 22,6 12,58 4,58"/>
    <polygon points="16,6 22,6 32,58 24,58"/>
    <polygon points="14,42 23,42 23,49 14,49"/>
    <!-- L: menor, alinhado pela base -->
    <polygon points="38,17 46,17 46,50 60,50 60,58 38,58"/>
  </g>
</svg>
